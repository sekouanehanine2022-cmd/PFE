name: Verifier la connexion Alwaysdata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connexion:
    name: Controle SSH sans deploiement
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Preparer SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALWAYSDATA_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Verifier le serveur sans le modifier
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/home/[a-zA-Z0-9_-]+/[a-zA-Z0-9_/-]+$ ]]
          [[ "$DEPLOY_PATH" != *..* ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          test -f .env
          test -f artisan
          command -v php
          command -v composer
          command -v rsync
          php artisan migrate:status --no-ansi
          php artisan schedule:list --no-ansi
          echo "Connexion SSH et prerequis verifies, aucun deploiement effectue."
          REMOTE
      - name: Retirer la cle du runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519
