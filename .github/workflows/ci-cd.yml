name: Tests et deploiement

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests Laravel et compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_mysql, dom, xml, curl, fileinfo
          coverage: none
          tools: composer:v2
      - name: Installer les dependances PHP
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Preparer la configuration de test
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Executer tous les tests
        run: php artisan test --compact
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Compiler les fichiers front-end
        run: |
          npm ci
          npm run build
      - name: Preparer uniquement les fichiers a deployer
        run: |
          mkdir -p release
          cp -R app bootstrap config lang public resources routes artisan composer.json composer.lock release/
          mkdir -p release/database
          cp -R database/migrations release/database/
          rm -f release/bootstrap/cache/*.php release/public/hot
          rm -rf release/public/storage
      - uses: actions/upload-artifact@v4
        with:
          name: application
          path: release/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deployer sur Alwaysdata
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: alwaysdata-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: application
          path: release
      - name: Configurer la connexion SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ALWAYSDATA_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Transferer et installer la version testee
        run: bash scripts/deploy-alwaysdata.sh
      - name: Verifier que le site repond
        run: curl --fail --silent --show-error --location --retry 3 "$DEPLOY_URL/login" --output /dev/null
      - name: Retirer la cle du runner
        if: always()
        run: rm -f ~/.ssh/id_ed25519
